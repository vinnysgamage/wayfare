services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wayfare
      POSTGRES_USER: wayfare
      POSTGRES_PASSWORD: wayfare
    ports:
      - "5432:5432"
    volumes:
      - wayfare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfare -d wayfare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wayfare_pgdata:
